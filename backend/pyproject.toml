[project]
name = "crimson-horizon-backend"
version = "0.1.0"
description = "CrimsonHorizon backend API (NASA Space Apps Challenge 2026)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.2",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
